# Perfil "local": base H2 en memoria, SIN Supabase y sin internet. Los datos se borran al cerrar la app.
# Se activa con:  mvn spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:aduanas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Carga ejemplos para que no se vea vacío
aduanas.datos-demo=true

      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="4" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="5"/>
    </filter>
    <!-- Filtro de "mancha": deforma mucho los bordes de los fondos de acuarela (nunca se aplica a texto) -->

      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="8" result="r"/>

spring.application.name=sistema-aduanas

# Datos de ejemplo al iniciar: APAGADO porque ahora los datos viven en la base de datos (Supabase).
# Si algún día vacías las tablas y quieres volver a cargar los 12 ejemplos, ponlo en true una vez.
aduanas.datos-demo=false

# Contraseñas iniciales de las cuentas. Solo se usan la PRIMERA vez que arranca la app:
# crean los usuarios admin (puede eliminar) y funcionario (no puede eliminar) en la tabla "usuarios".
# Después viven en la base de datos (con hash), y cambiar esto ya no las modifica.

# ---------- JWT (token de sesión) ----------
# Clave secreta con la que se firman los tokens (mínimo 32 caracteres). No la compartas.
# Si cambias esta clave, las sesiones abiertas dejan de valer (hay que iniciar sesión de nuevo).
# Duración del token en horas
aduanas.jwt.horas=8

# ---------- Conexión a Supabase (PostgreSQL) por el Session pooler (compatible con IPv4) ----------
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres

# Pool de conexiones pequeño (el plan gratuito de Supabase tiene pocas conexiones)
spring.datasource.hikari.maximum-pool-size=5

# Hibernate crea/actualiza las tablas según las entidades (@Entity) al arrancar
spring.jpa.hibernate.ddl-auto=update

# No mantener la conexión abierta durante la respuesta HTTP (buena práctica)
spring.jpa.open-in-view=false

# ---------- Despliegue ----------
# En la nube el puerto lo asigna la plataforma (variable PORT); en local sigue siendo 8080.
server.port=${PORT:8080}

# ---------- Secretos ----------
# Las claves (base de datos, JWT y contraseñas iniciales) NO están en este archivo para poder subir el código a GitHub.
# En local se leen de secretos.properties (junto al pom.xml, ignorado por git); en la nube, de variables de entorno
# (SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, ADUANAS_JWT_SECRETO, ...).
spring.config.import=optional:file:./secretos.properties
